name: CI

# Gate PRs on the same checks the wrap-slice ritual runs locally: backend unit tests + frontend
# typecheck/build/lint. Complements the CodeQL security workflow (kept separate on purpose).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13' # matches the Lambda runtime (ADR-002)
      - name: Install dev deps
        run: pip install -r tests/requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest tests/unit -q

  frontend:
    name: Frontend tests + typecheck + build + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests (Vitest + React Testing Library)
        # Runs first: typecheck and build cannot tell whether a single component renders, so before
        # slice 9 a green frontend job proved only that the code compiled. This is the step that
        # makes the gate real — see the plan doc's note on frontend Dependabot auto-merge.
        run: npm test
      - name: Build (tsc + vite)
        run: npm run build
      - name: Lint
        run: npm run lint
