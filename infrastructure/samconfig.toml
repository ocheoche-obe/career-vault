version = 0.1

# `sam deploy` (no flags) uses [default] → dev. `sam deploy --config-env prod` → prod.
# Per architecture Section 5.5: dev and prod coexist in one account, isolated by the
# Environment parameter and resource-name suffixes.
#
# NOTE: CognitoDomainPrefix must be globally unique within the region. If deploy fails with
# a domain-already-exists error, change the prefix below (e.g. add your initials/account).
#
# Reserved concurrency (arch §4.7.4, ADR-030) is switched on here rather than in the template so
# the -1 "off" default still works on accounts whose Lambda concurrency limit has not been raised.
# This account's limit was restored to 1000, so the caps are live: 5 + 5 + 5 + 2 + 2 reserved
# leaves 981 unreserved, well above Lambda's 100-unreserved floor. (resume_agent = 2 per ADR-037:
# it self-invokes asynchronously, so it needs room for an in-flight worker plus a fresh POST/GET.)

[default.deploy.parameters]
stack_name = "careervault-dev"
resolve_s3 = true
s3_prefix = "careervault-dev"
region = "us-east-1"
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND"
parameter_overrides = [
    "Environment=dev",
    "LogLevel=DEBUG",
    "CognitoDomainPrefix=careervault-dev",
    "CallbackUrl=http://localhost:5173",
    "SettingsReservedConcurrency=5",
    "ChatReservedConcurrency=5",
    "CareerCrudReservedConcurrency=5",
    "ResumeParserReservedConcurrency=2",
    "ResumeAgentReservedConcurrency=2",
    # Sonnet 5 is not grantable on this account (ADR-036 live-access correction); run on the newest
    # accessible Sonnet. Pinned explicitly — CloudFormation reuses a stack's previous param value for
    # anything not listed here, so a template-default change alone wouldn't take effect.
    "SonnetInferenceProfileId=us.anthropic.claude-sonnet-4-6",
    "SonnetFoundationModelId=anthropic.claude-sonnet-4-6",
]

[default.build.parameters]
cached = true
parallel = true

[prod.deploy.parameters]
stack_name = "careervault-prod"
resolve_s3 = true
s3_prefix = "careervault-prod"
region = "us-east-1"
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND"
parameter_overrides = [
    "Environment=prod",
    "LogLevel=INFO",
    "CognitoDomainPrefix=careervault-prod",
    # The template now creates CloudFront in every env, and the app client auto-allows the
    # distribution's own domain. CallbackUrl only needs listing extra (non-CloudFront) origins;
    # prod isn't deployed yet, so localhost is a harmless placeholder until prod's first deploy.
    "CallbackUrl=http://localhost:5173",
    "SettingsReservedConcurrency=5",
    "ChatReservedConcurrency=5",
    "CareerCrudReservedConcurrency=5",
    "ResumeParserReservedConcurrency=2",
    "ResumeAgentReservedConcurrency=2",
    # Sonnet 5 is not grantable on this account (ADR-036 live-access correction); run on the newest
    # accessible Sonnet. Pinned explicitly — CloudFormation reuses a stack's previous param value for
    # anything not listed here, so a template-default change alone wouldn't take effect.
    "SonnetInferenceProfileId=us.anthropic.claude-sonnet-4-6",
    "SonnetFoundationModelId=anthropic.claude-sonnet-4-6",
]

[prod.build.parameters]
cached = true
parallel = true
