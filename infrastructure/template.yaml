AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CareerVault (slices 1–6a). DynamoDB single table (RESUMERUN TTL), Cognito Hosted UI (ADR-025),
  REST API Gateway + Cognito authorizer, careervault-shared + careervault-weasyprint layers
  (ADR-023). Lambdas: settings, chat, career_crud (entry ingestion + CRUD, Section 3.1), frontend
  hosting via S3 + CloudFront OAC (ADR-019), resume_upload_parser (ADR-035), and resume_agent —
  the six-phase Sonnet 5 résumé loop run as an async job (ADR-036 / ADR-037). Check-ins / SES
  are out of scope here.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment environment; suffixes resource names and selects the SSM config path.
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]
    Description: POWERTOOLS_LOG_LEVEL for all functions (DEBUG in dev, INFO in prod).
  CognitoDomainPrefix:
    Type: String
    Description: >
      Prefix for the Cognito Hosted UI domain
      (<prefix>.auth.<region>.amazoncognito.com). Must be globally unique within the region.
  CallbackUrl:
    Type: String
    Default: http://localhost:5173
    Description: OAuth2 callback / logout URL for the SPA (localhost for the deferred-hosting slice).
  SettingsReservedConcurrency:
    Type: Number
    Default: -1
    Description: >
      Reserved concurrency for settings_lambda (cost guard, arch §4.7.4). -1 disables it
      (omits the property) — required on accounts with the new-account default Lambda
      concurrency limit of 10, where reserving any concurrency leaves <10 unreserved and is
      rejected. Set to a positive value (e.g. 5) once a Service Quotas increase is in place.
  ChatReservedConcurrency:
    Type: Number
    Default: -1
    Description: >
      Reserved concurrency for chat_lambda (arch §4.7.4 target: 5). Same -1 sentinel as
      SettingsReservedConcurrency (ADR-030). This is the primary runaway-Bedrock-cost guard.
  CareerCrudReservedConcurrency:
    Type: Number
    Default: -1
    Description: >
      Reserved concurrency for career_crud (arch §4.7.4 target: 5). Same -1 sentinel (ADR-030).
  ResumeParserReservedConcurrency:
    Type: Number
    Default: -1
    Description: >
      Reserved concurrency for resume_upload_parser (arch §4.7.4 target: 2). Same -1 sentinel
      (ADR-030). A parse is one Haiku call; a low cap bounds runaway-Bedrock cost (slice 5).
  HaikuInferenceProfileId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: >
      Cross-region inference profile ID invoked for Claude Haiku 4.5 (ADR-031). Haiku 4.5 has no
      on-demand support, so this — not the bare foundation-model ID — is what Converse is called
      with. Kept in lockstep with HaikuFoundationModelId, which drives the IAM grant.
  HaikuFoundationModelId:
    Type: String
    Default: anthropic.claude-haiku-4-5-20251001-v1:0
    Description: >
      The foundation model behind HaikuInferenceProfileId. Needed separately because the `us.`
      profile routes inference across us-east-1/us-east-2/us-west-2, and IAM must grant
      bedrock:InvokeModel on the foundation-model ARN in *each* of those regions (ADR-031).
  TitanEmbedModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    Description: >
      Titan Text Embeddings v2 model ID (ADR-016 / ADR-024). On-demand, so it is invoked by its
      bare model ID and its IAM grant is a single us-east-1 foundation-model ARN.
  SonnetInferenceProfileId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-6
    Description: >
      Cross-region inference profile ID for the resume agent's high-value-reasoning model (ADR-036).
      Sonnet is INFERENCE_PROFILE-only (no on-demand), so this — not the bare foundation-model ID —
      is what Converse is called with. Kept in lockstep with SonnetFoundationModelId (the IAM grant).
      NOTE: ADR-036 chose Sonnet 5, but it is not grantable on this account ("not available for this
      account", AccessDeniedException — account-tier gated, not a self-serve Model-access toggle). So
      MVP runs on Sonnet 4-6, the newest *accessible* Sonnet. Flip back to us.anthropic.claude-sonnet-5
      here + SonnetFoundationModelId if/when access lands (ADR-036 live-access correction).
  SonnetFoundationModelId:
    Type: String
    Default: anthropic.claude-sonnet-4-6
    Description: >
      Foundation model behind SonnetInferenceProfileId. Needed separately because the `us.` profile
      routes across us-east-1/us-east-2/us-west-2, and IAM must grant bedrock:InvokeModel on the
      foundation-model ARN in each of those regions (ADR-031 pattern, applied to Sonnet per ADR-036).
  ResumeAgentReservedConcurrency:
    Type: Number
    Default: -1
    Description: >
      Reserved concurrency for resume_agent (ADR-036 target, revised to 2 by ADR-037). Same -1
      sentinel (ADR-030). The agent self-invokes asynchronously (ADR-037), so it needs room for an
      in-flight worker plus a fresh POST/GET; 2 still bounds parallel runaway Bedrock spend, and the
      per-run token ceiling (ADR-036) is the primary cost guard.
  AlarmEmail:
    Type: String
    Default: oche.ocheobe@gmail.com
    Description: Email subscribed to the CloudWatch alarm SNS topic (arch §4.1.4).
  LogRetentionInDays:
    Type: Number
    Default: 14
    Description: CloudWatch Logs retention for Lambda log groups (operational hygiene, arch §4.7).
  DupSimilarityThreshold:
    Type: String
    Default: "0.90"
    Description: >
      Cosine-similarity threshold above which a confirmed entry is flagged a possible duplicate
      (ADR-033). Parameterized so it can be calibrated against real entries without a code change.

Conditions:
  # Deletion Protection only in prod (arch §4.7.3 protects irreplaceable career history). In dev
  # it would wedge the stack in ROLLBACK_FAILED whenever a create/update rolls back. PITR stays
  # on everywhere — it's near-zero cost and does not block deletes.
  IsProd: !Equals [!Ref Environment, prod]
  HasSettingsReservedConcurrency: !Not [!Equals [!Ref SettingsReservedConcurrency, -1]]
  HasChatReservedConcurrency: !Not [!Equals [!Ref ChatReservedConcurrency, -1]]
  HasCareerCrudReservedConcurrency: !Not [!Equals [!Ref CareerCrudReservedConcurrency, -1]]
  HasResumeParserReservedConcurrency: !Not [!Equals [!Ref ResumeParserReservedConcurrency, -1]]
  HasResumeAgentReservedConcurrency: !Not [!Equals [!Ref ResumeAgentReservedConcurrency, -1]]

Globals:
  Function:
    Runtime: python3.13
    MemorySize: 512
    Timeout: 30
    Tracing: Active
    Architectures:
      - arm64
    Tags:
      Project: CareerVault
      Environment: !Ref Environment
      ManagedBy: SAM
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        POWERTOOLS_LOG_LEVEL: !Ref LogLevel
        POWERTOOLS_METRICS_NAMESPACE: CareerVault
        CAREERVAULT_TABLE_NAME: !Ref CareerVaultTable
        # With Lambda proxy integration the function echoes the allow-origin header on real
        # responses; API Gateway's Cors block below only covers the OPTIONS preflight.
        # Wildcard is safe here: the API is Bearer-token auth with no cookies (ADR-034).
        CORS_ALLOW_ORIGIN: "*"

Resources:
  # ---------------------------------------------------------------------------
  # Data — single-table design (ADR-005 / Section 2)
  # ---------------------------------------------------------------------------
  CareerVaultTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'CareerVaultTable-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      # Career history is irreplaceable; both are near-zero cost (Section 4.7.3).
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: !If [IsProd, true, false]
      # RESUMERUN# job/trace items self-expire 30 days after creation (§3.2.5 / ADR-037). Only items
      # that carry an `expires_at` epoch attribute are ever deleted; career entries have none.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      # AWS-managed KMS key (aws/dynamodb) — satisfies NFR-4.2 at no extra cost, no kms:* on roles.
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: CareerVault
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM

  # ---------------------------------------------------------------------------
  # Auth — Cognito Hosted UI, OAuth2 Authorization Code + PKCE (ADR-025)
  # ---------------------------------------------------------------------------
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'careervault-${Environment}'
      # Single-tenant MVP: the one user is created administratively (ADR-006 / ADR-025).
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      UserPoolTags:
        Project: CareerVault
        Environment: !Ref Environment
        ManagedBy: SAM

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'careervault-spa-${Environment}'
      UserPoolId: !Ref CognitoUserPool
      # Public SPA client — no secret; security comes from PKCE (ADR-025).
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      # localhost (CallbackUrl param) for `npm run dev`, plus the CloudFront origin for the
      # deployed app. GetAtt on the distribution resolves the chicken-and-egg within the stack
      # (the *.cloudfront.net domain isn't known until the distribution is created). Slice 4.
      CallbackURLs:
        - !Ref CallbackUrl
        - !Sub "https://${SiteDistribution.DomainName}"
      LogoutURLs:
        - !Ref CallbackUrl
        - !Sub "https://${SiteDistribution.DomainName}"
      SupportedIdentityProviders:
        - COGNITO
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref CognitoUserPool

  # ---------------------------------------------------------------------------
  # API — REST API Gateway with a Cognito User Pools authorizer
  # ---------------------------------------------------------------------------
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'careervault-api-${Environment}'
      StageName: !Ref Environment
      TracingEnabled: true
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        # Keep the CORS preflight (OPTIONS) unauthenticated so the browser can reach it.
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn
            Identity:
              Header: Authorization
      Cors:
        # Wildcard preflight origin — safe for this non-credentialed Bearer-token API (ADR-034).
        # No AllowCredentials (the spec forbids pairing it with '*', and the app sends no cookies).
        AllowOrigin: "'*'"
        AllowHeaders: "'Authorization,Content-Type'"
        # PUT/DELETE land with the entry CRUD routes (slice 3, career_crud).
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"

  # ---------------------------------------------------------------------------
  # Shared Lambda layer (ADR-023 / Section 5.3) — attached to every function
  # ---------------------------------------------------------------------------
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub 'careervault-shared-${Environment}'
      Description: Shared CareerVault utilities — observability, DDB helpers, Pydantic models.
      # ContentUri is the `python/` folder (with requirements.txt inside it): the python3.13
      # build method copies ContentUri's *contents* into the artifact's python/ and installs
      # deps there too, so `careervault/` lands at /opt/python/careervault (import `careervault`).
      ContentUri: ../backend/shared/python/
      CompatibleRuntimes:
        - python3.13
      CompatibleArchitectures:
        - arm64
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.13
      BuildArchitecture: arm64

  # ---------------------------------------------------------------------------
  # WeasyPrint Lambda layer (ADR-023 / ADR-018) — attached ONLY to resume_agent. WeasyPrint + its
  # native Pango closure + fonts, built by the Makefile inside the AL2023 arm64 build container.
  # Requires `sam build --use-container` so the shared objects match the Lambda runtime. Slice 6a.
  # ---------------------------------------------------------------------------
  WeasyPrintLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub 'careervault-weasyprint-${Environment}'
      Description: WeasyPrint + Pango/fontconfig native libs + fonts for resume PDF rendering.
      ContentUri: ./weasyprint-layer/
      CompatibleRuntimes:
        - python3.13
      CompatibleArchitectures:
        - arm64
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: makefile
      BuildArchitecture: arm64

  # ---------------------------------------------------------------------------
  # Compute — settings_lambda (smallest blast radius; Section 4.2.3)
  # ---------------------------------------------------------------------------
  SettingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'careervault-settings-${Environment}'
      CodeUri: ../backend/functions/settings/
      Handler: handler.handler
      MemorySize: 256
      Timeout: 5
      ReservedConcurrentExecutions: !If
        - HasSettingsReservedConcurrency
        - !Ref SettingsReservedConcurrency
        - !Ref AWS::NoValue
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: settings_lambda
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt CareerVaultTable.Arn
      Events:
        GetSettings:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /settings
            Method: get

  # Explicit log group so retention is bounded (arch §4.7 operational hygiene) rather than
  # "never expire". Name matches Lambda's convention so the function writes here.
  # NOTE: if the function has already run, Lambda has auto-created this log group; adding this
  # resource then fails on the next deploy with "already exists". One-time fix: delete the
  # existing group first (`aws logs delete-log-group --log-group-name /aws/lambda/careervault-settings-<env>`)
  # or deploy onto a fresh stack.
  SettingsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/careervault-settings-${Environment}'
      RetentionInDays: !Ref LogRetentionInDays

  # ---------------------------------------------------------------------------
  # Compute — chat_lambda (Phase A parse turn, Section 3.1.1)
  #
  # Writes CONVO# items only. It deliberately has no ENTRY# write permission: entry creation is
  # career_crud's exclusive privilege, so an LLM hallucination or prompt injection here cannot
  # bypass the user's confirmation step (Section 4.2.3).
  # ---------------------------------------------------------------------------
  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'careervault-chat-${Environment}'
      CodeUri: ../backend/functions/chat/
      Handler: handler.handler
      # One Bedrock call plus two DDB writes; 30s leaves headroom for Haiku cold-path latency.
      Timeout: 30
      ReservedConcurrentExecutions: !If
        - HasChatReservedConcurrency
        - !Ref ChatReservedConcurrency
        - !Ref AWS::NoValue
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: chat_lambda
          BEDROCK_HAIKU_MODEL_ID: !Ref HaikuInferenceProfileId
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:PutItem
              Resource: !GetAtt CareerVaultTable.Arn
            # ADR-031: Haiku 4.5 is INFERENCE_PROFILE-only. Invoking through the `us.` profile
            # requires BOTH the profile ARN and the foundation-model ARN in every region the
            # profile can route to — the call is authorized where it actually executes.
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${HaikuInferenceProfileId}'
                - !Sub 'arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/${HaikuFoundationModelId}'
                - !Sub 'arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/${HaikuFoundationModelId}'
                - !Sub 'arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/${HaikuFoundationModelId}'
      Events:
        PostChat:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /chat
            Method: post

  ChatLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/careervault-chat-${Environment}'
      RetentionInDays: !Ref LogRetentionInDays

  # ---------------------------------------------------------------------------
  # Compute — career_crud (entry lifecycle, Sections 3.1.3–3.1.5 / ADR-027 / ADR-033)
  #
  # The only Lambda that may write, update, or delete ENTRY# items. Embeds via Titan inline
  # (ADR-024). Slice 3 adds GET/PUT/DELETE alongside the original POST.
  #
  # IAM: GetItem + PutItem + Query + DeleteItem. Note there is NO UpdateItem despite §4.2.3
  # listing it — edits are a conditional full-item PutItem (attribute_exists(SK)), not an
  # UpdateItem, since the client submits the whole re-validated entry (see the §2.5 / §4.2.3
  # slice-3 note in the architecture doc). PutItem therefore covers both create and edit.
  # ---------------------------------------------------------------------------
  CareerCrudFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'careervault-career-crud-${Environment}'
      CodeUri: ../backend/functions/career_crud/
      Handler: handler.handler
      # Titan embed (~200–500 ms) + a full-corpus Query for the dup check (ADR-033) + a
      # conditional PutItem; 15s is ample (arch §4.7.4).
      Timeout: 15
      ReservedConcurrentExecutions: !If
        - HasCareerCrudReservedConcurrency
        - !Ref CareerCrudReservedConcurrency
        - !Ref AWS::NoValue
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: career_crud
          BEDROCK_TITAN_EMBED_MODEL_ID: !Ref TitanEmbedModelId
          DUP_SIMILARITY_THRESHOLD: !Ref DupSimilarityThreshold
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query      # AP-10 list + the ADR-033 dup-check read
                - dynamodb:DeleteItem  # AP-6 hard delete (ADR-027)
              Resource: !GetAtt CareerVaultTable.Arn
            # Titan v2 is ON_DEMAND (ADR-031): a single, version-pinned foundation-model ARN in
            # this region. No inference profile involved.
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${TitanEmbedModelId}'
      Events:
        PostEntries:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries
            Method: post
        GetEntries:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries
            Method: get
        PutEntry:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/{id}
            Method: put
        DeleteEntry:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/{id}
            Method: delete

  CareerCrudLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/careervault-career-crud-${Environment}'
      RetentionInDays: !Ref LogRetentionInDays

  # ---------------------------------------------------------------------------
  # Data — resume upload/output bucket (ADR-013 / ADR-035, arch §4.4.3). Slice 5.
  #
  # Private (all public access blocked), SSE-S3. Two logical prefixes: uploads/ (raw resumes the
  # user PUTs via a presigned URL) and resumes/ (generated PDFs — provisioned here, first written
  # by slice 6). CORS allows the browser's cross-origin presigned PUT/GET; wildcard origin matches
  # the non-credentialed posture of ADR-034 (the presigned URL, not the Origin, is the authority).
  # ---------------------------------------------------------------------------
  DataBucket:
    Type: AWS::S3::Bucket
    # Career uploads/outputs are user data — retain in prod, delete cleanly in dev (arch §4.7.3).
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BucketName: !Sub 'careervault-data-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          # The browser only ever does the presigned PUT; parse/read is server-side, so PUT is the
          # only cross-origin method needed. Wildcard origin matches ADR-034 (the presigned
          # signature, not the Origin, is the authority) — the bucket stays private.
          - AllowedMethods: [PUT]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          # A raw upload is only needed during the synchronous parse; expire it the next day so no
          # resume bytes linger.
          - Id: ExpireRawUploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 1
          # Generated resumes expire with their RESUMERUN trace item (ADR-037's 30-day DDB TTL) so a
          # run's record and its artifacts die together — ADR-015 as amended 2026-07-27. The original
          # "keep the newest indefinitely, 7 days for the rest" is not expressible here: lifecycle
          # filters on prefix/tag/age, with no "except the newest object" predicate.
          - Id: ExpireGeneratedResumes
            Status: Enabled
            Prefix: resumes/
            ExpirationInDays: 30
      Tags:
        - { Key: Project, Value: CareerVault }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: SAM }

  # ---------------------------------------------------------------------------
  # Compute — resume_upload_parser (ADR-013 / ADR-035). Parse-only: presigns uploads and turns an
  # uploaded PDF/DOCX into entry candidates via one Haiku call. It has NO Titan grant and NO
  # DynamoDB grant — embedding and persistence stay at career_crud's POST /entries (the single
  # embedding site). Bedrock IAM mirrors chat_lambda's Haiku profile grant (ADR-031).
  # ---------------------------------------------------------------------------
  ResumeUploadParserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'careervault-resume-upload-parser-${Environment}'
      CodeUri: ../backend/functions/resume_upload_parser/
      Handler: handler.handler
      # PDF/DOCX extraction is CPU-bound; more memory buys proportional CPU for a snappier sync parse.
      MemorySize: 1024
      # Fronted by a synchronous API route, so it is bounded in practice by API Gateway's 29s
      # integration timeout; 60s is headroom for Haiku cold-path latency (arch §4.7.4 v1.6 note).
      Timeout: 60
      ReservedConcurrentExecutions: !If
        - HasResumeParserReservedConcurrency
        - !Ref ResumeParserReservedConcurrency
        - !Ref AWS::NoValue
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: resume_upload_parser
          BEDROCK_HAIKU_MODEL_ID: !Ref HaikuInferenceProfileId
          DATA_BUCKET_NAME: !Ref DataBucket
      Policies:
        - Statement:
            # Presign (PutObject) + parse read-back (GetObject), scoped to the uploads/ prefix. IAM
            # can't scope to a per-request user, so the handler asserts the uploads/<user_id>/
            # prefix in code (Section 4.2.4). No resumes/ access — that's slice 6's resume_agent.
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub '${DataBucket.Arn}/uploads/*'
            # ADR-031: Haiku 4.5 is INFERENCE_PROFILE-only — grant the profile ARN plus the
            # foundation-model ARN in every region the profile can route to. No Titan grant.
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${HaikuInferenceProfileId}'
                - !Sub 'arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/${HaikuFoundationModelId}'
                - !Sub 'arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/${HaikuFoundationModelId}'
                - !Sub 'arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/${HaikuFoundationModelId}'
      Events:
        PostPresign:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /uploads/presign
            Method: post
        PostParse:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /uploads/parse
            Method: post

  ResumeUploadParserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/careervault-resume-upload-parser-${Environment}'
      RetentionInDays: !Ref LogRetentionInDays

  # ---------------------------------------------------------------------------
  # Compute — resume_agent (the payoff feature, Section 3.2 / FR-5 / ADR-010 / ADR-036 / ADR-037).
  #
  # ONE function, THREE roles (ADR-037): POST /resumes/generate starts an async job (writes a
  # `pending` RESUMERUN item, self-invokes asynchronously, returns 202); the async worker runs the
  # six-phase Sonnet loop + renders HTML/PDF (WeasyPrint layer) + finalizes the item; GET
  # /resumes/{run_id} polls status and presigns fresh download URLs. Résumé runs take 40–120s, far
  # past API Gateway's 29s ceiling — hence async (ADR-037).
  #
  # IAM: Query+GetItem (entries+profile) + PutItem (RESUMERUN trace); S3 Put/Get on resumes/*;
  # Bedrock Sonnet+Haiku profiles (+regional foundation-model ARNs, ADR-031/036) + Titan; and
  # lambda:InvokeFunction on its OWN ARN (constructed by name, not GetAtt, to dodge a circular dep).
  # ---------------------------------------------------------------------------
  ResumeAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'careervault-resume-agent-${Environment}'
      CodeUri: ../backend/functions/resume_agent/
      Handler: handler.handler
      # More memory buys proportional CPU for WeasyPrint PDF rendering and the agent's JSON churn.
      MemorySize: 1536
      # The async worker runs the bounded loop (240s wall-clock budget, ADR-036) — 300s is the
      # backstop per §3.2.4. The API-facing POST/GET invocations return in well under a second.
      Timeout: 300
      ReservedConcurrentExecutions: !If
        - HasResumeAgentReservedConcurrency
        - !Ref ResumeAgentReservedConcurrency
        - !Ref AWS::NoValue
      Layers:
        - !Ref SharedLayer
        - !Ref WeasyPrintLayer
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: resume_agent
          BEDROCK_SONNET_MODEL_ID: !Ref SonnetInferenceProfileId
          BEDROCK_HAIKU_MODEL_ID: !Ref HaikuInferenceProfileId
          BEDROCK_TITAN_EMBED_MODEL_ID: !Ref TitanEmbedModelId
          # Sonnet's structured draft/revise calls run long (a full résumé is a big output). The
          # shared bedrock_client defaults to a 25s read timeout (fine for Haiku parse turns); give
          # the agent 120s per call so a normal long generation doesn't trip a socket timeout. The
          # per-run wall-clock budget (240s, ADR-036) and the 300s Lambda timeout still bound it.
          BEDROCK_READ_TIMEOUT_SECONDS: "120"
          DATA_BUCKET_NAME: !Ref DataBucket
          # WeasyPrint (layer) finds its fonts via fontconfig; its cache must be on a writable path.
          FONTCONFIG_PATH: /opt/fonts
          XDG_CACHE_HOME: /tmp
          HOME: /tmp
      Policies:
        - Statement:
            # Read entries + profile for retrieval; write the RESUMERUN job/trace item. No
            # ENTRY/PROFILE write — the agent is read-only over user data (§3.2.7).
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt CareerVaultTable.Arn
            # Store + read back the generated HTML/PDF. Scoped to resumes/* (never uploads/*).
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub '${DataBucket.Arn}/resumes/*'
            # Async self-invocation (ADR-037). ARN built by name to avoid a self-referential
            # GetAtt circular dependency.
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:careervault-resume-agent-${Environment}'
            # Sonnet 5 (ADR-036) + Haiku (Phase 1, ADR-031): both INFERENCE_PROFILE-only — grant the
            # profile ARN plus the foundation-model ARN in every region the `us.` profile routes to.
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${SonnetInferenceProfileId}'
                - !Sub 'arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/${SonnetFoundationModelId}'
                - !Sub 'arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/${SonnetFoundationModelId}'
                - !Sub 'arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/${SonnetFoundationModelId}'
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${HaikuInferenceProfileId}'
                - !Sub 'arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/${HaikuFoundationModelId}'
                - !Sub 'arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/${HaikuFoundationModelId}'
                - !Sub 'arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/${HaikuFoundationModelId}'
            # Titan v2 query embedding for search_entries (ADR-016) — on-demand, single regional ARN.
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${TitanEmbedModelId}'
      Events:
        PostGenerate:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /resumes/generate
            Method: post
        GetResumeRun:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /resumes/{run_id}
            Method: get

  ResumeAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/careervault-resume-agent-${Environment}'
      RetentionInDays: !Ref LogRetentionInDays

  # ---------------------------------------------------------------------------
  # Cost & operational guardrails (arch §4.1.4)
  # ---------------------------------------------------------------------------
  # Single SNS topic for all CareerVault alarms; the user's email is subscribed (confirm the
  # subscription via the link AWS emails on first deploy). The SES bounce/complaint topic (4.5)
  # is intentionally separate and not part of this slice.
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'careervault-alarms-${Environment}'
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  # Per-Lambda error backstop (arch §4.1.4): > 5 errors in 5 minutes.
  SettingsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'careervault-settings-errors-${Environment}'
      AlarmDescription: settings_lambda errors exceeded threshold (arch §4.1.4)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SettingsFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ChatErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'careervault-chat-errors-${Environment}'
      AlarmDescription: chat_lambda errors exceeded threshold (arch §4.1.4)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ChatFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  CareerCrudErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'careervault-career-crud-errors-${Environment}'
      AlarmDescription: career_crud errors exceeded threshold (arch §4.1.4)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CareerCrudFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ResumeUploadParserErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'careervault-resume-upload-parser-errors-${Environment}'
      AlarmDescription: resume_upload_parser errors exceeded threshold (arch §4.1.4)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ResumeUploadParserFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ResumeAgentErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'careervault-resume-agent-errors-${Environment}'
      AlarmDescription: resume_agent errors exceeded threshold (arch §4.1.4)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ResumeAgentFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # Account-wide billing alarms (AWS/Billing EstimatedCharges, us-east-1 only). Gated to prod to
  # avoid duplicate account-level alarms across stacks; in dev-only periods the AWS Budget
  # 'careervault-monthly-5usd' is the active account-wide guard. Tightened to the $5 hard ceiling:
  # warning at $3, critical at $5. Requires "Receive Billing Alerts" enabled in Billing prefs.
  BillingAlarmWarning:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      AlarmName: careervault-billing-warning-3usd
      AlarmDescription: Account estimated charges exceeded $3 (warning)
      Namespace: AWS/Billing
      MetricName: EstimatedCharges
      Dimensions:
        - Name: Currency
          Value: USD
      Statistic: Maximum
      Period: 21600
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
  BillingAlarmCritical:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      AlarmName: careervault-billing-critical-5usd
      AlarmDescription: Account estimated charges exceeded the $5 ceiling (critical)
      Namespace: AWS/Billing
      MetricName: EstimatedCharges
      Dimensions:
        - Name: Currency
          Value: USD
      Statistic: Maximum
      Period: 21600
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # ---------------------------------------------------------------------------
  # Frontend hosting — private S3 bucket + CloudFront with Origin Access Control
  # (ADR-019, arch §5.7). Default *.cloudfront.net domain; custom domain deferred
  # to v1.x (ADR-019 amendment 2026-07-15). Slice 4.
  # ---------------------------------------------------------------------------
  SiteBucket:
    Type: AWS::S3::Bucket
    # Retain in prod so an accidental stack delete can't take the site content with it; in dev
    # let it delete cleanly (empty on teardown handled by the deploy tooling / manual `rm`).
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BucketName: !Sub 'careervault-web-${Environment}-${AWS::AccountId}'
      # Private bucket — CloudFront reaches it via OAC (signed requests), never the public.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - { Key: Project, Value: CareerVault }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: SAM }

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'careervault-web-oac-${Environment}'
        Description: OAC so CloudFront can read the private site bucket via SigV4.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'CareerVault frontend (${Environment})'
        DefaultRootObject: index.html
        # PriceClass_100 = North America + Europe edges only — the cheapest tier, right for the
        # $5 ceiling and a single-user app.
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        Origins:
          - Id: SiteBucketOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOAC
            # OAC replaces the legacy Origin Access Identity, so OAI must be empty string.
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: SiteBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          # AWS managed "CachingOptimized" policy — no cookies/query/headers in the cache key.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        # SPA routing: the React Router owns client-side paths. S3 returns 403 (OAC) or 404 for
        # any key that isn't a real object, so map both to index.html/200 and let the app route.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
        ViewerCertificate:
          # Default *.cloudfront.net cert — no ACM/custom domain at MVP (ADR-019 amendment).
          CloudFrontDefaultCertificate: true
      Tags:
        - { Key: Project, Value: CareerVault }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: SAM }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Grant only this distribution read access, via the OAC service principal + SourceArn.
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution.Id}'

Outputs:
  CognitoUserPoolId:
    Description: Cognito User Pool ID — frontend VITE_COGNITO_AUTHORITY is derived from this.
    Value: !Ref CognitoUserPool
  CognitoUserPoolClientId:
    Description: Cognito User Pool App Client ID — frontend VITE_COGNITO_CLIENT_ID.
    Value: !Ref CognitoUserPoolClient
  CognitoHostedDomain:
    Description: Cognito Hosted UI domain — frontend VITE_COGNITO_DOMAIN (logout endpoint).
    Value: !Sub '${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
  ApiGatewayBaseUrl:
    Description: REST API base URL — frontend VITE_API_BASE_URL.
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  DataBucketName:
    Description: S3 data bucket for resume uploads (uploads/) and generated resumes (resumes/).
    Value: !Ref DataBucket
  SiteBucketName:
    Description: S3 bucket the built frontend syncs into (`aws s3 sync dist/`).
    Value: !Ref SiteBucket
  CloudFrontDistributionId:
    Description: CloudFront distribution ID — used for `create-invalidation` after each deploy.
    Value: !Ref SiteDistribution
  CloudFrontUrl:
    Description: Public HTTPS URL of the deployed frontend (default *.cloudfront.net domain).
    Value: !Sub 'https://${SiteDistribution.DomainName}'
