AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CareerVault — slices 1 + 2. Provisions the DynamoDB single table, Cognito User Pool + Hosted UI
  (ADR-025), a REST API Gateway with a Cognito authorizer, the careervault-shared Lambda layer
  (ADR-023), settings_lambda (GET /settings), chat_lambda (POST /chat) and career_crud
  (POST /entries) for conversational entry ingestion (Section 3.1, ADR-031).
  Resume agent / check-ins / S3 / SES / CloudFront are intentionally out of scope here.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment environment; suffixes resource names and selects the SSM config path.
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]
    Description: POWERTOOLS_LOG_LEVEL for all functions (DEBUG in dev, INFO in prod).
  CognitoDomainPrefix:
    Type: String
    Description: >
      Prefix for the Cognito Hosted UI domain
      (<prefix>.auth.<region>.amazoncognito.com). Must be globally unique within the region.
  CallbackUrl:
    Type: String
    Default: http://localhost:5173
    Description: OAuth2 callback / logout URL for the SPA (localhost for the deferred-hosting slice).
  SettingsReservedConcurrency:
    Type: Number
    Default: -1
    Description: >
      Reserved concurrency for settings_lambda (cost guard, arch §4.7.4). -1 disables it
      (omits the property) — required on accounts with the new-account default Lambda
      concurrency limit of 10, where reserving any concurrency leaves <10 unreserved and is
      rejected. Set to a positive value (e.g. 5) once a Service Quotas increase is in place.
  ChatReservedConcurrency:
    Type: Number
    Default: -1
    Description: >
      Reserved concurrency for chat_lambda (arch §4.7.4 target: 5). Same -1 sentinel as
      SettingsReservedConcurrency (ADR-030). This is the primary runaway-Bedrock-cost guard.
  CareerCrudReservedConcurrency:
    Type: Number
    Default: -1
    Description: >
      Reserved concurrency for career_crud (arch §4.7.4 target: 5). Same -1 sentinel (ADR-030).
  HaikuInferenceProfileId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: >
      Cross-region inference profile ID invoked for Claude Haiku 4.5 (ADR-031). Haiku 4.5 has no
      on-demand support, so this — not the bare foundation-model ID — is what Converse is called
      with. Kept in lockstep with HaikuFoundationModelId, which drives the IAM grant.
  HaikuFoundationModelId:
    Type: String
    Default: anthropic.claude-haiku-4-5-20251001-v1:0
    Description: >
      The foundation model behind HaikuInferenceProfileId. Needed separately because the `us.`
      profile routes inference across us-east-1/us-east-2/us-west-2, and IAM must grant
      bedrock:InvokeModel on the foundation-model ARN in *each* of those regions (ADR-031).
  TitanEmbedModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    Description: >
      Titan Text Embeddings v2 model ID (ADR-016 / ADR-024). On-demand, so it is invoked by its
      bare model ID and its IAM grant is a single us-east-1 foundation-model ARN.
  AlarmEmail:
    Type: String
    Default: oche.ocheobe@gmail.com
    Description: Email subscribed to the CloudWatch alarm SNS topic (arch §4.1.4).
  LogRetentionInDays:
    Type: Number
    Default: 14
    Description: CloudWatch Logs retention for Lambda log groups (operational hygiene, arch §4.7).
  DupSimilarityThreshold:
    Type: String
    Default: "0.90"
    Description: >
      Cosine-similarity threshold above which a confirmed entry is flagged a possible duplicate
      (ADR-033). Parameterized so it can be calibrated against real entries without a code change.

Conditions:
  # Deletion Protection only in prod (arch §4.7.3 protects irreplaceable career history). In dev
  # it would wedge the stack in ROLLBACK_FAILED whenever a create/update rolls back. PITR stays
  # on everywhere — it's near-zero cost and does not block deletes.
  IsProd: !Equals [!Ref Environment, prod]
  HasSettingsReservedConcurrency: !Not [!Equals [!Ref SettingsReservedConcurrency, -1]]
  HasChatReservedConcurrency: !Not [!Equals [!Ref ChatReservedConcurrency, -1]]
  HasCareerCrudReservedConcurrency: !Not [!Equals [!Ref CareerCrudReservedConcurrency, -1]]

Globals:
  Function:
    Runtime: python3.13
    MemorySize: 512
    Timeout: 30
    Tracing: Active
    Architectures:
      - arm64
    Tags:
      Project: CareerVault
      Environment: !Ref Environment
      ManagedBy: SAM
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        POWERTOOLS_LOG_LEVEL: !Ref LogLevel
        POWERTOOLS_METRICS_NAMESPACE: CareerVault
        CAREERVAULT_TABLE_NAME: !Ref CareerVaultTable
        # With Lambda proxy integration the function echoes the allow-origin header on real
        # responses; API Gateway's Cors block below only covers the OPTIONS preflight.
        CORS_ALLOW_ORIGIN: !Ref CallbackUrl

Resources:
  # ---------------------------------------------------------------------------
  # Data — single-table design (ADR-005 / Section 2)
  # ---------------------------------------------------------------------------
  CareerVaultTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'CareerVaultTable-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      # Career history is irreplaceable; both are near-zero cost (Section 4.7.3).
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: !If [IsProd, true, false]
      # AWS-managed KMS key (aws/dynamodb) — satisfies NFR-4.2 at no extra cost, no kms:* on roles.
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: CareerVault
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM

  # ---------------------------------------------------------------------------
  # Auth — Cognito Hosted UI, OAuth2 Authorization Code + PKCE (ADR-025)
  # ---------------------------------------------------------------------------
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'careervault-${Environment}'
      # Single-tenant MVP: the one user is created administratively (ADR-006 / ADR-025).
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      UserPoolTags:
        Project: CareerVault
        Environment: !Ref Environment
        ManagedBy: SAM

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'careervault-spa-${Environment}'
      UserPoolId: !Ref CognitoUserPool
      # Public SPA client — no secret; security comes from PKCE (ADR-025).
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Ref CallbackUrl
      LogoutURLs:
        - !Ref CallbackUrl
      SupportedIdentityProviders:
        - COGNITO
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref CognitoUserPool

  # ---------------------------------------------------------------------------
  # API — REST API Gateway with a Cognito User Pools authorizer
  # ---------------------------------------------------------------------------
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'careervault-api-${Environment}'
      StageName: !Ref Environment
      TracingEnabled: true
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        # Keep the CORS preflight (OPTIONS) unauthenticated so the browser can reach it.
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn
            Identity:
              Header: Authorization
      Cors:
        AllowOrigin: !Sub "'${CallbackUrl}'"
        AllowHeaders: "'Authorization,Content-Type'"
        # PUT/DELETE land with the entry CRUD routes (slice 3, career_crud).
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"

  # ---------------------------------------------------------------------------
  # Shared Lambda layer (ADR-023 / Section 5.3) — attached to every function
  # ---------------------------------------------------------------------------
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub 'careervault-shared-${Environment}'
      Description: Shared CareerVault utilities — observability, DDB helpers, Pydantic models.
      # ContentUri is the `python/` folder (with requirements.txt inside it): the python3.13
      # build method copies ContentUri's *contents* into the artifact's python/ and installs
      # deps there too, so `careervault/` lands at /opt/python/careervault (import `careervault`).
      ContentUri: ../backend/shared/python/
      CompatibleRuntimes:
        - python3.13
      CompatibleArchitectures:
        - arm64
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.13
      BuildArchitecture: arm64

  # ---------------------------------------------------------------------------
  # Compute — settings_lambda (smallest blast radius; Section 4.2.3)
  # ---------------------------------------------------------------------------
  SettingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'careervault-settings-${Environment}'
      CodeUri: ../backend/functions/settings/
      Handler: handler.handler
      MemorySize: 256
      Timeout: 5
      ReservedConcurrentExecutions: !If
        - HasSettingsReservedConcurrency
        - !Ref SettingsReservedConcurrency
        - !Ref AWS::NoValue
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: settings_lambda
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt CareerVaultTable.Arn
      Events:
        GetSettings:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /settings
            Method: get

  # Explicit log group so retention is bounded (arch §4.7 operational hygiene) rather than
  # "never expire". Name matches Lambda's convention so the function writes here.
  # NOTE: if the function has already run, Lambda has auto-created this log group; adding this
  # resource then fails on the next deploy with "already exists". One-time fix: delete the
  # existing group first (`aws logs delete-log-group --log-group-name /aws/lambda/careervault-settings-<env>`)
  # or deploy onto a fresh stack.
  SettingsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/careervault-settings-${Environment}'
      RetentionInDays: !Ref LogRetentionInDays

  # ---------------------------------------------------------------------------
  # Compute — chat_lambda (Phase A parse turn, Section 3.1.1)
  #
  # Writes CONVO# items only. It deliberately has no ENTRY# write permission: entry creation is
  # career_crud's exclusive privilege, so an LLM hallucination or prompt injection here cannot
  # bypass the user's confirmation step (Section 4.2.3).
  # ---------------------------------------------------------------------------
  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'careervault-chat-${Environment}'
      CodeUri: ../backend/functions/chat/
      Handler: handler.handler
      # One Bedrock call plus two DDB writes; 30s leaves headroom for Haiku cold-path latency.
      Timeout: 30
      ReservedConcurrentExecutions: !If
        - HasChatReservedConcurrency
        - !Ref ChatReservedConcurrency
        - !Ref AWS::NoValue
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: chat_lambda
          BEDROCK_HAIKU_MODEL_ID: !Ref HaikuInferenceProfileId
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:PutItem
              Resource: !GetAtt CareerVaultTable.Arn
            # ADR-031: Haiku 4.5 is INFERENCE_PROFILE-only. Invoking through the `us.` profile
            # requires BOTH the profile ARN and the foundation-model ARN in every region the
            # profile can route to — the call is authorized where it actually executes.
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${HaikuInferenceProfileId}'
                - !Sub 'arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/${HaikuFoundationModelId}'
                - !Sub 'arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/${HaikuFoundationModelId}'
                - !Sub 'arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/${HaikuFoundationModelId}'
      Events:
        PostChat:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /chat
            Method: post

  ChatLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/careervault-chat-${Environment}'
      RetentionInDays: !Ref LogRetentionInDays

  # ---------------------------------------------------------------------------
  # Compute — career_crud (entry lifecycle, Sections 3.1.3–3.1.5 / ADR-027 / ADR-033)
  #
  # The only Lambda that may write, update, or delete ENTRY# items. Embeds via Titan inline
  # (ADR-024). Slice 3 adds GET/PUT/DELETE alongside the original POST.
  #
  # IAM: GetItem + PutItem + Query + DeleteItem. Note there is NO UpdateItem despite §4.2.3
  # listing it — edits are a conditional full-item PutItem (attribute_exists(SK)), not an
  # UpdateItem, since the client submits the whole re-validated entry (see the §2.5 / §4.2.3
  # slice-3 note in the architecture doc). PutItem therefore covers both create and edit.
  # ---------------------------------------------------------------------------
  CareerCrudFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'careervault-career-crud-${Environment}'
      CodeUri: ../backend/functions/career_crud/
      Handler: handler.handler
      # Titan embed (~200–500 ms) + a full-corpus Query for the dup check (ADR-033) + a
      # conditional PutItem; 15s is ample (arch §4.7.4).
      Timeout: 15
      ReservedConcurrentExecutions: !If
        - HasCareerCrudReservedConcurrency
        - !Ref CareerCrudReservedConcurrency
        - !Ref AWS::NoValue
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: career_crud
          BEDROCK_TITAN_EMBED_MODEL_ID: !Ref TitanEmbedModelId
          DUP_SIMILARITY_THRESHOLD: !Ref DupSimilarityThreshold
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query      # AP-10 list + the ADR-033 dup-check read
                - dynamodb:DeleteItem  # AP-6 hard delete (ADR-027)
              Resource: !GetAtt CareerVaultTable.Arn
            # Titan v2 is ON_DEMAND (ADR-031): a single, version-pinned foundation-model ARN in
            # this region. No inference profile involved.
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${TitanEmbedModelId}'
      Events:
        PostEntries:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries
            Method: post
        GetEntries:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries
            Method: get
        PutEntry:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/{id}
            Method: put
        DeleteEntry:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/{id}
            Method: delete

  CareerCrudLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/careervault-career-crud-${Environment}'
      RetentionInDays: !Ref LogRetentionInDays

  # ---------------------------------------------------------------------------
  # Cost & operational guardrails (arch §4.1.4)
  # ---------------------------------------------------------------------------
  # Single SNS topic for all CareerVault alarms; the user's email is subscribed (confirm the
  # subscription via the link AWS emails on first deploy). The SES bounce/complaint topic (4.5)
  # is intentionally separate and not part of this slice.
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'careervault-alarms-${Environment}'
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  # Per-Lambda error backstop (arch §4.1.4): > 5 errors in 5 minutes.
  SettingsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'careervault-settings-errors-${Environment}'
      AlarmDescription: settings_lambda errors exceeded threshold (arch §4.1.4)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SettingsFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ChatErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'careervault-chat-errors-${Environment}'
      AlarmDescription: chat_lambda errors exceeded threshold (arch §4.1.4)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ChatFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  CareerCrudErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'careervault-career-crud-errors-${Environment}'
      AlarmDescription: career_crud errors exceeded threshold (arch §4.1.4)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CareerCrudFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # Account-wide billing alarms (AWS/Billing EstimatedCharges, us-east-1 only). Gated to prod to
  # avoid duplicate account-level alarms across stacks; in dev-only periods the AWS Budget
  # 'careervault-monthly-5usd' is the active account-wide guard. Tightened to the $5 hard ceiling:
  # warning at $3, critical at $5. Requires "Receive Billing Alerts" enabled in Billing prefs.
  BillingAlarmWarning:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      AlarmName: careervault-billing-warning-3usd
      AlarmDescription: Account estimated charges exceeded $3 (warning)
      Namespace: AWS/Billing
      MetricName: EstimatedCharges
      Dimensions:
        - Name: Currency
          Value: USD
      Statistic: Maximum
      Period: 21600
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
  BillingAlarmCritical:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      AlarmName: careervault-billing-critical-5usd
      AlarmDescription: Account estimated charges exceeded the $5 ceiling (critical)
      Namespace: AWS/Billing
      MetricName: EstimatedCharges
      Dimensions:
        - Name: Currency
          Value: USD
      Statistic: Maximum
      Period: 21600
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

Outputs:
  CognitoUserPoolId:
    Description: Cognito User Pool ID — frontend VITE_COGNITO_AUTHORITY is derived from this.
    Value: !Ref CognitoUserPool
  CognitoUserPoolClientId:
    Description: Cognito User Pool App Client ID — frontend VITE_COGNITO_CLIENT_ID.
    Value: !Ref CognitoUserPoolClient
  CognitoHostedDomain:
    Description: Cognito Hosted UI domain — frontend VITE_COGNITO_DOMAIN (logout endpoint).
    Value: !Sub '${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
  ApiGatewayBaseUrl:
    Description: REST API base URL — frontend VITE_API_BASE_URL.
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
