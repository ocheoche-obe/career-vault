AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CareerVault — first vertical slice (auth + GET /settings). Provisions the DynamoDB
  single table, Cognito User Pool + Hosted UI (ADR-025), a REST API Gateway with a Cognito
  authorizer, the careervault-shared Lambda layer (ADR-023), and settings_lambda.
  Chat / resume agent / check-ins / S3 / SES / CloudFront are intentionally out of scope here.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment environment; suffixes resource names and selects the SSM config path.
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]
    Description: POWERTOOLS_LOG_LEVEL for all functions (DEBUG in dev, INFO in prod).
  CognitoDomainPrefix:
    Type: String
    Description: >
      Prefix for the Cognito Hosted UI domain
      (<prefix>.auth.<region>.amazoncognito.com). Must be globally unique within the region.
  CallbackUrl:
    Type: String
    Default: http://localhost:5173
    Description: OAuth2 callback / logout URL for the SPA (localhost for the deferred-hosting slice).
  SettingsReservedConcurrency:
    Type: Number
    Default: -1
    Description: >
      Reserved concurrency for settings_lambda (cost guard, arch §4.7.4). -1 disables it
      (omits the property) — required on accounts with the new-account default Lambda
      concurrency limit of 10, where reserving any concurrency leaves <10 unreserved and is
      rejected. Set to a positive value (e.g. 5) once a Service Quotas increase is in place.
  AlarmEmail:
    Type: String
    Default: oche.ocheobe@gmail.com
    Description: Email subscribed to the CloudWatch alarm SNS topic (arch §4.1.4).
  LogRetentionInDays:
    Type: Number
    Default: 14
    Description: CloudWatch Logs retention for Lambda log groups (operational hygiene, arch §4.7).

Conditions:
  # Deletion Protection only in prod (arch §4.7.3 protects irreplaceable career history). In dev
  # it would wedge the stack in ROLLBACK_FAILED whenever a create/update rolls back. PITR stays
  # on everywhere — it's near-zero cost and does not block deletes.
  IsProd: !Equals [!Ref Environment, prod]
  HasSettingsReservedConcurrency: !Not [!Equals [!Ref SettingsReservedConcurrency, -1]]

Globals:
  Function:
    Runtime: python3.13
    MemorySize: 512
    Timeout: 30
    Tracing: Active
    Architectures:
      - arm64
    Tags:
      Project: CareerVault
      Environment: !Ref Environment
      ManagedBy: SAM
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        POWERTOOLS_LOG_LEVEL: !Ref LogLevel
        POWERTOOLS_METRICS_NAMESPACE: CareerVault
        CAREERVAULT_TABLE_NAME: !Ref CareerVaultTable

Resources:
  # ---------------------------------------------------------------------------
  # Data — single-table design (ADR-005 / Section 2)
  # ---------------------------------------------------------------------------
  CareerVaultTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'CareerVaultTable-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      # Career history is irreplaceable; both are near-zero cost (Section 4.7.3).
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: !If [IsProd, true, false]
      # AWS-managed KMS key (aws/dynamodb) — satisfies NFR-4.2 at no extra cost, no kms:* on roles.
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: CareerVault
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM

  # ---------------------------------------------------------------------------
  # Auth — Cognito Hosted UI, OAuth2 Authorization Code + PKCE (ADR-025)
  # ---------------------------------------------------------------------------
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'careervault-${Environment}'
      # Single-tenant MVP: the one user is created administratively (ADR-006 / ADR-025).
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      UserPoolTags:
        Project: CareerVault
        Environment: !Ref Environment
        ManagedBy: SAM

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'careervault-spa-${Environment}'
      UserPoolId: !Ref CognitoUserPool
      # Public SPA client — no secret; security comes from PKCE (ADR-025).
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Ref CallbackUrl
      LogoutURLs:
        - !Ref CallbackUrl
      SupportedIdentityProviders:
        - COGNITO
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref CognitoUserPool

  # ---------------------------------------------------------------------------
  # API — REST API Gateway with a Cognito User Pools authorizer
  # ---------------------------------------------------------------------------
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'careervault-api-${Environment}'
      StageName: !Ref Environment
      TracingEnabled: true
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        # Keep the CORS preflight (OPTIONS) unauthenticated so the browser can reach it.
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn
            Identity:
              Header: Authorization
      Cors:
        AllowOrigin: "'http://localhost:5173'"
        AllowHeaders: "'Authorization,Content-Type'"
        AllowMethods: "'GET,OPTIONS'"

  # ---------------------------------------------------------------------------
  # Shared Lambda layer (ADR-023 / Section 5.3) — attached to every function
  # ---------------------------------------------------------------------------
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub 'careervault-shared-${Environment}'
      Description: Shared CareerVault utilities — observability, DDB helpers, Pydantic models.
      # ContentUri is the `python/` folder (with requirements.txt inside it): the python3.13
      # build method copies ContentUri's *contents* into the artifact's python/ and installs
      # deps there too, so `careervault/` lands at /opt/python/careervault (import `careervault`).
      ContentUri: ../backend/shared/python/
      CompatibleRuntimes:
        - python3.13
      CompatibleArchitectures:
        - arm64
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.13
      BuildArchitecture: arm64

  # ---------------------------------------------------------------------------
  # Compute — settings_lambda (smallest blast radius; Section 4.2.3)
  # ---------------------------------------------------------------------------
  SettingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'careervault-settings-${Environment}'
      CodeUri: ../backend/functions/settings/
      Handler: handler.handler
      MemorySize: 256
      Timeout: 5
      ReservedConcurrentExecutions: !If
        - HasSettingsReservedConcurrency
        - !Ref SettingsReservedConcurrency
        - !Ref AWS::NoValue
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: settings_lambda
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt CareerVaultTable.Arn
      Events:
        GetSettings:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /settings
            Method: get

  # Explicit log group so retention is bounded (arch §4.7 operational hygiene) rather than
  # "never expire". Name matches Lambda's convention so the function writes here.
  # NOTE: if the function has already run, Lambda has auto-created this log group; adding this
  # resource then fails on the next deploy with "already exists". One-time fix: delete the
  # existing group first (`aws logs delete-log-group --log-group-name /aws/lambda/careervault-settings-<env>`)
  # or deploy onto a fresh stack.
  SettingsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/careervault-settings-${Environment}'
      RetentionInDays: !Ref LogRetentionInDays

  # ---------------------------------------------------------------------------
  # Cost & operational guardrails (arch §4.1.4)
  # ---------------------------------------------------------------------------
  # Single SNS topic for all CareerVault alarms; the user's email is subscribed (confirm the
  # subscription via the link AWS emails on first deploy). The SES bounce/complaint topic (4.5)
  # is intentionally separate and not part of this slice.
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'careervault-alarms-${Environment}'
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  # Per-Lambda error backstop (arch §4.1.4): > 5 errors in 5 minutes.
  SettingsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'careervault-settings-errors-${Environment}'
      AlarmDescription: settings_lambda errors exceeded threshold (arch §4.1.4)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SettingsFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # Account-wide billing alarms (AWS/Billing EstimatedCharges, us-east-1 only). Gated to prod to
  # avoid duplicate account-level alarms across stacks; in dev-only periods the AWS Budget
  # 'careervault-monthly-5usd' is the active account-wide guard. Tightened to the $5 hard ceiling:
  # warning at $3, critical at $5. Requires "Receive Billing Alerts" enabled in Billing prefs.
  BillingAlarmWarning:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      AlarmName: careervault-billing-warning-3usd
      AlarmDescription: Account estimated charges exceeded $3 (warning)
      Namespace: AWS/Billing
      MetricName: EstimatedCharges
      Dimensions:
        - Name: Currency
          Value: USD
      Statistic: Maximum
      Period: 21600
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
  BillingAlarmCritical:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      AlarmName: careervault-billing-critical-5usd
      AlarmDescription: Account estimated charges exceeded the $5 ceiling (critical)
      Namespace: AWS/Billing
      MetricName: EstimatedCharges
      Dimensions:
        - Name: Currency
          Value: USD
      Statistic: Maximum
      Period: 21600
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

Outputs:
  CognitoUserPoolId:
    Description: Cognito User Pool ID — frontend VITE_COGNITO_AUTHORITY is derived from this.
    Value: !Ref CognitoUserPool
  CognitoUserPoolClientId:
    Description: Cognito User Pool App Client ID — frontend VITE_COGNITO_CLIENT_ID.
    Value: !Ref CognitoUserPoolClient
  CognitoHostedDomain:
    Description: Cognito Hosted UI domain — frontend VITE_COGNITO_DOMAIN (logout endpoint).
    Value: !Sub '${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
  ApiGatewayBaseUrl:
    Description: REST API base URL — frontend VITE_API_BASE_URL.
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
